name: Snapshot Governance quality gates

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify filing architecture and local quality certificate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Verify canonical filing architecture and repository purity
        run: >-
          cargo +1.97.1
          --config _data/cargo_config.toml
          test
          --manifest-path _data/Cargo.toml
          --all-features
          --test filing_system

      - name: Exercise public evidence and physical boundary controls
        run: |
          python3 -B testing/_code/security_controls.py
          python3 -B testing/_code/portable_controls.py
          cargo +1.97.1 --config _data/cargo_config.toml test --manifest-path _data/Cargo.toml --all-features -p fortress-core -p fortress-cli --lib --test security_boundaries --test verifier_boundary --test cli_boundary_controls --test documentation_controls --test agent_integration

      - name: Verify passing local certificate and freshness stamps
        run: >-
          python3
          engine/snapshot_governance/_code/quality_certificate.py
          verify .

  qualify_untrusted_boundaries:
    name: Qualify Linux repository and transaction boundaries
    runs-on: ubuntu-latest
    # A single compiler job bounds memory; cold optimized builds need a separate
    # operational deadline. This is not a latency certification criterion.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Exercise bounded storage and record integrity
        run: |
          python3 -B engine/snapshot_governance/testing/_code/execution_storage.py
          python3 -B engine/snapshot_governance/testing/_code/derived_artifact_storage.py

      - name: Exercise recovery, source reconciliation and trust boundaries
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fortress-boundary-target
        run: >-
          cargo +1.97.1
          --config _data/cargo_config.toml
          test
          --manifest-path _data/Cargo.toml
          --all-features
          -p fortress-core
          --test bounded_observation
          --test migration_governance
          --test candidate
          --test onboarding
          --test protected_authority
          --test provider_ingest
          --test governance_query

      - name: Verify parser admission and epoch recovery
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fortress-boundary-target
        run: |
          cargo +1.97.1 --config _data/cargo_config.toml test --manifest-path _data/Cargo.toml --all-features -p fortress-core --test resident_session parser_admission_rejects_oversized_requests_without_publishing
          cargo +1.97.1 --config _data/cargo_config.toml test --manifest-path _data/Cargo.toml --all-features -p fortress-core --test resident_session early_source_limits_preserve_typed_failure_and_published_generation

  qualify_editor:
    name: Qualify local desktop editor workflow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Install the pinned extension build runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false

      - name: Build the local extension and exercise transport controls
        run: |
          python3 -B editor/_code/build.py "$RUNNER_TEMP/fortress-editor-stage" --install-tools --vsix
          node --test "$RUNNER_TEMP/fortress-editor-stage/out/testing/_code/client.js"
          python3 -B editor/_code/build.py "$RUNNER_TEMP/fortress-editor-replay" --tools "$RUNNER_TEMP/fortress-editor-stage" --vsix
          cmp "$RUNNER_TEMP/fortress-editor-stage/fortress-development.vsix" "$RUNNER_TEMP/fortress-editor-replay/fortress-development.vsix"

      - name: Prepare the pinned desktop fixture with renderer isolation
        run: |
          mkdir "$RUNNER_TEMP/fortress-vscode"
          curl --fail --silent --show-error --location --retry 3 --max-time 600 --max-filesize 500000000 \
            https://update.code.visualstudio.com/1.147.0/linux-x64/stable \
            --output "$RUNNER_TEMP/fortress-vscode/editor.tar.gz"
          echo "6fd8b14600f2a8ddb8b4833d8bf288f3dc4c34b2878d2c6c3fec7e16c81023bc  $RUNNER_TEMP/fortress-vscode/editor.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/fortress-vscode/editor.tar.gz" -C "$RUNNER_TEMP/fortress-vscode"
          sudo mkdir -m 0755 /opt/fortress-desktop-fixture
          sudo cp -R "$RUNNER_TEMP/fortress-vscode/VSCode-linux-x64/." /opt/fortress-desktop-fixture
          editor=/opt/fortress-desktop-fixture/code
          # Let the verified, root-owned editor create its Chromium renderer sandbox.
          userns_restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$userns_restriction" && "$(< "$userns_restriction")" == 1 ]]; then
            cat > "$RUNNER_TEMP/fortress-desktop-fixture.apparmor" <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile fortress-desktop-fixture /opt/fortress-desktop-fixture/code flags=(unconfined) {
            userns,
          }
          APPARMOR
            sudo apparmor_parser -r "$RUNNER_TEMP/fortress-desktop-fixture.apparmor"
          fi
          "$(dirname "$editor")/bin/code" --version | tee "$RUNNER_TEMP/fortress-vscode/version.txt"
          grep -Fx '1.147.0' "$RUNNER_TEMP/fortress-vscode/version.txt"
          grep -Fx '8a14f0cc1b08d531eb83255ea3764ae22aa932b5' "$RUNNER_TEMP/fortress-vscode/version.txt"

      - name: Build the installed-service fixture
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fortress-editor-target
        run: >-
          cargo +1.97.1 --config _data/cargo_config.toml build --locked
          --manifest-path _data/Cargo.toml --all-features -p fortress-cli

      - name: Run the real desktop extension host
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fortress-editor-target
        run: |
          python3 -B editor/testing/_code/host_runner.py --xvfb --editor /opt/fortress-desktop-fixture/code \
            --fortress "$CARGO_TARGET_DIR/debug/fortress" --stage "$RUNNER_TEMP/fortress-editor-stage" \
            --results "$RUNNER_TEMP/fortress-editor-results"
