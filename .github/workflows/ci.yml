name: Snapshot Governance quality gates

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current Fortress capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Configure build environment
        shell: bash
        run: |
          echo "CARGO_RESOLVER_LOCKFILE_PATH=$GITHUB_WORKSPACE/info/Cargo.lock" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/fortress-target" >> "$GITHUB_ENV"

      - name: Verify formatting
        run: cargo +1.97.1 --config data/cargo_config.toml fmt --manifest-path data/Cargo.toml --all --check

      - name: Deny Rust and Clippy warnings
        run: cargo +1.97.1 --config data/cargo_config.toml clippy --manifest-path data/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Validate schema registry and draft standard
        run: cargo +1.97.1 --config data/cargo_config.toml test --manifest-path data/Cargo.toml -p fortress-core --test schema_registry

      - name: Validate Fortress self-model
        run: cargo +1.97.1 --config data/cargo_config.toml test --manifest-path data/Cargo.toml -p fortress-cli --test self_model

      - name: Run workspace tests
        run: cargo +1.97.1 --config data/cargo_config.toml test --manifest-path data/Cargo.toml --workspace --all-targets --all-features

      - name: Verify deterministic committed self-CCG
        shell: bash
        run: |
          first="$(mktemp)"
          second="$(mktemp)"
          trap 'rm -f "$first" "$second"' EXIT
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- ccg . --format json --output "$first"
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- ccg . --format json --output "$second"
          cmp "$first" "$second"
          cmp "$first" info/contract_coherency_graph.json

      - name: Verify deterministic committed Intended self-BFG
        shell: bash
        run: |
          first="$(mktemp)"
          second="$(mktemp)"
          trap 'rm -f "$first" "$second"' EXIT
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- bfg . --format json --output "$first"
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- bfg . --format json --output "$second"
          cmp "$first" "$second"
          cmp "$first" info/behavioral_flow_graph.json

      - name: Run Fortress self-audit
        run: cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- audit .

      - name: Verify deterministic audit JSON
        shell: bash
        run: |
          first="$(mktemp)"
          second="$(mktemp)"
          trap 'rm -f "$first" "$second"' EXIT
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- audit . --format json > "$first"
          cargo +1.97.1 --config data/cargo_config.toml run --quiet --manifest-path data/Cargo.toml -p fortress-cli -- audit . --format json > "$second"
          cmp "$first" "$second"

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 --config data/cargo_config.toml doc --manifest-path data/Cargo.toml --workspace --all-features --no-deps
