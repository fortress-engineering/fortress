name: Snapshot Governance quality gates

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify filing architecture and local quality certificate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Verify canonical filing architecture and repository purity
        run: >-
          cargo +1.97.1
          --config _data/cargo_config.toml
          test
          --manifest-path _data/Cargo.toml
          --all-features
          --test filing_system

      - name: Exercise public evidence and physical boundary controls
        run: |
          python3 -B testing/_code/security_controls.py
          python3 -B testing/_code/portable_controls.py
          cargo +1.97.1 --config _data/cargo_config.toml test --manifest-path _data/Cargo.toml --all-features -p fortress-core -p fortress-cli --lib --test security_boundaries --test verifier_boundary

      - name: Verify passing local certificate and freshness stamps
        run: >-
          python3
          engine/snapshot_governance/_code/quality_certificate.py
          verify .

  qualify_untrusted_boundaries:
    name: Qualify Linux repository and transaction boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ runner.temp }}/fortress-boundary-target
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Exercise bounded storage and record integrity
        run: |
          python3 -B engine/snapshot_governance/testing/_code/execution_storage.py
          python3 -B engine/snapshot_governance/testing/_code/derived_artifact_storage.py

      - name: Exercise recovery, source reconciliation and trust boundaries
        run: >-
          cargo +1.97.1
          --config _data/cargo_config.toml
          test
          --manifest-path _data/Cargo.toml
          --all-features
          -p fortress-core
          --test bounded_observation
          --test migration_governance
          --test candidate
          --test onboarding
          --test protected_authority
          --test provider_ingest
          --test governance_query
