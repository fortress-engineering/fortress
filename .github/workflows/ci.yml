name: Snapshot Governance quality gates

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify local quality certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Verify passing local certificate and freshness stamps
        run: >-
          python3
          mods/engine/mods/snapshot_governance/code/quality_certificate.py
          verify .
