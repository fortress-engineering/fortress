[workspace]
members = [
  "../engine/_data",
  "../cli/_data",
  "../testing/_data",
  "../testing/semantic_oracle/_data",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Fortress Engineering"]
description = "Engineering control plane for coherent, auditable, certifiable software development"
repository = "https://github.com/fortress-engineering/fortress"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.dev.package.fortress-core]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.fortress-core]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.serde_json]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.serde_json]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.syn]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.syn]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.proc-macro2]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.proc-macro2]
opt-level = 3
debug-assertions = true
overflow-checks = true
